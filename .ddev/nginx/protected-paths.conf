# These directories are not public assets. ^~ prevents the generic static-file
# regex locations from serving archives or configuration beneath them.
location = /private-files { return 403; }
location ^~ /private-files/ { return 403; }
location = /tmp { return 403; }
location ^~ /tmp/ { return 403; }
location = /sync { return 403; }
location ^~ /sync/ { return 403; }

# Project metadata and Composer packages must not be served directly either.
location = /vendor { return 403; }
location ^~ /vendor/ { return 403; }
location = /scripts { return 403; }
location ^~ /scripts/ { return 403; }
location = /deployment { return 403; }
location ^~ /deployment/ { return 403; }
location = /docs { return 403; }
location ^~ /docs/ { return 403; }
location = /assets/scaffold { return 403; }
location ^~ /assets/scaffold/ { return 403; }
location ~* ^/(?:composer\.(?:json|lock)|DRUPAL-11-APPRAISAL\.md|README\.md)$ { return 403; }
